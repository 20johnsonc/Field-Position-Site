<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Position | CFB Power Ratings & Matchup Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    /* Base Index Colors */
    --field: #0f2818;
    --field-dark: #0a1c10;
    --chalk: #f4f0e1;
    --chalk-dim: #e8e2cd;
    --ink: #141a12;
    --gold: #e0a13d;
    --gold-dim: #a97a2c;
    --hash: #2c4a34;
    --muted: #8a9a8b;
    --good: #5f9e6f;
    --bad: #b5573f;
    
    /* Matchup Card Specific Colors */
    --field-line: #1B3A28;
    --chalk-line: #E1D9BE;
    --ink-dim: #6B6656;
    --model: #B8452E;
    --market: #5E6F63;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 120px),
      linear-gradient(180deg, var(--field) 0%, var(--field-dark) 100%);
    color: var(--chalk);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* --- Header & Nav --- */
  header {
    padding: 36px 24px 24px;
    max-width: 1180px;
    margin: 0 auto;
    border-bottom: 1px solid var(--field-line);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  .brand h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 2.4rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--chalk);
  }
  .brand h1 span { color: var(--gold); }
  .brand .tag {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
  .meta-row {
    margin-top: 14px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .meta-row b { color: var(--gold); }

  nav {
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 24px 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  nav button {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 0.85rem;
    font-weight: 500;
    background: transparent;
    border: 1px solid var(--hash);
    color: var(--muted);
    padding: 9px 20px;
    cursor: pointer;
    transition: all .15s ease;
  }
  nav button.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--ink);
  }
  nav button:not(.active):hover {
    border-color: var(--gold-dim);
    color: var(--chalk);
  }

  main { max-width: 1180px; margin: 0 auto; padding: 28px 24px; }
  section { display: none; }
  section.active { display: block; }

  /* --- Rankings Table --- */
  .rank-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    background: rgba(244,240,225,0.03);
  }
  .rank-table thead th {
    text-align: left;
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-size: 0.7rem;
    color: var(--gold);
    padding: 10px 12px;
    border-bottom: 2px solid var(--gold-dim);
  }
  .rank-table td {
    padding: 9px 12px;
    border-bottom: 1px solid rgba(138,154,139,0.15);
  }
  .rank-table tbody tr:hover { background: rgba(224,161,61,0.07); }
  .rank-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank-table td.rank { color: var(--gold); font-weight: 700; width: 36px; }
  .rank-table td.team { font-family: 'Oswald', sans-serif; letter-spacing: 0.2px; color: var(--chalk); font-size: 0.92rem; }
  .rank-table td.rating { font-weight: 700; color: var(--chalk); }

  /* --- Scatter Chart Section --- */
  .chart-container {
    background: rgba(244,240,225,0.03);
    border: 1px solid var(--field-line);
    border-radius: 6px;
    padding: 20px;
    position: relative;
    height: 600px;
    width: 100%;
  }

  /* --- Matchup Cards (Merged Design) --- */
  .matchup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
    gap: 28px;
  }
  @media (max-width: 860px) {
    .matchup-grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--chalk);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 18px 40px -18px rgba(0,0,0,0.55);
  }
  .card-head {
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 46px),
      var(--field);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .matchup {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .badge {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.02em;
    flex: none;
  }
  .badge.away {
    background: transparent;
    border: 1.5px solid rgba(243,238,221,0.45);
    color: var(--chalk);
  }
  .badge.home {
    background: var(--gold);
    color: var(--field);
    border: 1.5px solid var(--gold);
  }
  .matchup-names {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    color: var(--chalk);
    font-size: 15px;
    letter-spacing: 0.03em;
    line-height: 1.2;
  }
  .matchup-names .at {
    color: var(--gold);
    font-weight: 400;
    margin: 0 5px;
    font-size: 12px;
  }
  .week-tag {
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  .card-body { padding: 22px 22px 18px; }

  .score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }
  .score-line {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 24px;
    color: var(--ink);
    letter-spacing: 0.01em;
  }

  .prob-ring {
    --pct: 50;
    width: 58px; height: 58px;
    border-radius: 50%;
    flex: none;
    background: conic-gradient(var(--gold) calc(var(--pct)*1%), var(--chalk-line) 0);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .prob-ring::before {
    content: '';
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--chalk);
  }
  .prob-ring span {
    position: relative;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 12.5px;
    color: var(--ink);
  }

  .prob-caption {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin: -10px 0 18px;
  }
  .prob-caption b { color: var(--model); }

  /* ---- stat gauge ---- */
  .stat { margin: 20px 0 26px; }
  .stat-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink);
  }
  .stat-value b { color: var(--model); }
  .stat-value .na { color: var(--market); }

  .gauge { position: relative; height: 34px; margin: 0 4px 4px; }
  .gauge-track {
    position: absolute; top: 14px; left: 0; right: 0;
    height: 4px; background: var(--chalk-line); border-radius: 2px;
  }
  .gauge-fill {
    position: absolute; top: 14px; height: 4px;
    background: var(--model); border-radius: 2px;
    opacity: 0.85;
  }
  .gauge-tick {
    position: absolute; top: 10px; width: 1px; height: 12px;
    background: var(--chalk-line);
  }
  .gauge-tick.zero { background: var(--ink-dim); width: 1.5px; }
  .gauge-ticklabel {
    position: absolute; top: 24px; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; color: var(--ink-dim);
  }
  .gauge-pin {
    position: absolute; top: -2px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
  }
  .gauge-pin .flag {
    background: var(--model);
    color: var(--chalk);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .gauge-pin .stem {
    width: 2px; height: 8px; background: var(--model);
  }

  /* ---- verdict ---- */
  .verdict {
    border-left: 3px solid var(--gold);
    padding: 10px 14px;
    margin: 4px 0 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    background: rgba(217,164,65,0.08);
  }
  .verdict b { font-weight: 600; }

  .btn-pbp {
    display: inline-block;
    width: 100%;
    text-align: center;
    background: var(--field);
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    font-family: 'Oswald', sans-serif;
    font-size: 0.85rem;
    padding: 8px 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s ease;
  }
  .btn-pbp:hover {
    background: var(--gold);
    color: var(--ink);
  }

  /* --- Modal Styles --- */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 28, 16, 0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: var(--field-dark);
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    width: 100%;
    max-width: 900px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 20px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.8rem;
    cursor: pointer;
  }
  .modal-close:hover { color: var(--gold); }
  .modal-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1.5rem;
    color: var(--chalk);
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .empty {
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 40px 0;
    text-align: center;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>FIELD <span>POSITION</span></h1>
    <div class="tag">power ratings &amp; matchup model — for research &amp; entertainment purposes only</div>
  </div>
  <div class="meta-row" id="metaRow">
    <span>LOADING…</span>
  </div>
</header>

<nav>
  <button id="navRankings" class="active">Power Ratings</button>
  <button id="navScatter">Scatter Chart</button>
  <button id="navMatchups">Matchup Cards</button>
</nav>

<main>
  <!-- 1. RANKINGS SECTION -->
  <section id="rankingsSection" class="active">
    <table class="rank-table">
      <thead>
        <tr>
          <th onclick="sortTable('rank')" style="cursor: pointer;"># ⇕</th>
          <th onclick="sortTable('team')" style="cursor: pointer;">Team ⇕</th>
          <th onclick="sortTable('power_rating')" style="text-align: right; cursor: pointer;">Rating ⇕</th>
          <th onclick="sortTable('adj_off_ppa')" style="text-align: right; cursor: pointer;">Off ⇕</th>
          <th onclick="sortTable('adj_def_ppa')" style="text-align: right; cursor: pointer;">Def ⇕</th>
          <th onclick="sortTable('elo')" style="text-align: right; cursor: pointer;">Elo ⇕</th>
          <th onclick="sortTable('talent')" style="text-align: right; cursor: pointer;">Talent ⇕</th>
          <th onclick="sortTable('rp_ratio')" style="text-align: right; cursor: pointer;">R/P Ratio ⇕</th>
        </tr>
      </thead>
      <tbody id="rankingsBody">
        <tr><td colspan="8" class="empty">Loading rankings…</td></tr>
      </tbody>
    </table>
  </section>

  <!-- 2. SCATTER CHART SECTION -->
  <section id="scatterSection">
    <div class="chart-container">
      <canvas id="kenpomChart"></canvas>
    </div>
  </section>

  <!-- 3. MATCHUPS SECTION -->
  <section id="matchupsSection">
    <div class="matchup-grid" id="matchupGrid">
      <div class="empty">Loading matchups…</div>
    </div>
  </section>
</main>

<!-- PBP DRILLDOWN MODAL -->
<div class="modal-overlay" id="pbpModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-title" id="pbpModalTitle">PPA Tug-of-War</div>
    <div style="height: 400px; position: relative;">
      <canvas id="pbpChart"></canvas>
    </div>
  </div>
</div>

<!-- Add alongside the existing pbpModal div -->
<div class="modal-overlay" id="teamModal">
  <div class="modal-content" style="max-width: 1100px;">
    <button class="modal-close" onclick="closeTeamModal()">&times;</button>
    <div class="modal-title" id="teamModalTitle">Team Performance</div>
    <div style="display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px;">
      <div style="height: 420px; position: relative;">
        <canvas id="teamTrajectoryChart"></canvas>
      </div>
      <div style="height: 420px; position: relative;">
        <canvas id="teamProfileChart"></canvas>
      </div>
    </div>
  </div>
</div>



<script>
let currentSortKey = 'rank';
let sortAscending = true;
let globalRankingsData = [];
let kenpomChartInstance = null;
let pbpChartInstance = null;

async function loadJSON(path){
  const res = await fetch(path);
  if(!res.ok) throw new Error('failed to load ' + path);
  return res.json();
}

let globalLeagueProfile = [];
let teamTrajectoryChartInstance = null;
let teamProfileChartInstance = null;

// Update renderRankings() — wrap team name in a clickable span:
// replace: <td class="team">${t.team}</td>
// with:
//   <td class="team"><span style="cursor:pointer; text-decoration: underline dotted; text-decoration-color: var(--gold-dim);" onclick="openTeamModal('${t.team}')">${t.team}</span></td>

function openTeamModal(teamName) {
  const teamData = globalRankingsData.find(t => t.team === teamName);
  if (!teamData) return;

  document.getElementById('teamModalTitle').innerText = `${teamName} — Season Performance`;
  document.getElementById('teamModal').classList.add('active');

  // --- Chart 1: Rating trajectory + game result dots ---
  const trajectory = teamData.trajectory || [];
  const gameLog = teamData.game_log || [];
  const gameByWeek = Object.fromEntries(gameLog.map(g => [g.week, g]));

  const trajLine = trajectory.map(p => ({ x: p.week, y: p.adj_off_ppa }));
  const gameDots = trajectory
    .filter(p => gameByWeek[p.week])
    .map(p => {
      const g = gameByWeek[p.week];
      return {
        x: p.week, y: p.adj_off_ppa,
        margin: g.margin, opponent: g.opponent, win: g.win,
      };
    });

  const ctx1 = document.getElementById('teamTrajectoryChart').getContext('2d');
  if (teamTrajectoryChartInstance) teamTrajectoryChartInstance.destroy();
  teamTrajectoryChartInstance = new Chart(ctx1, {
    type: 'scatter',
    data: {
      datasets: [
        {
          label: 'Adj. Off PPA (Kalman)',
          data: trajLine,
          type: 'line',
          borderColor: '#e0a13d',
          backgroundColor: 'transparent',
          pointRadius: 0,
          tension: 0.15,
          order: 2,
        },
        {
          label: 'Game Result',
          data: gameDots,
          backgroundColor: gameDots.map(g => g.win ? '#5f9e6f' : '#b5573f'),
          pointRadius: gameDots.map(g => Math.max(5, Math.min(Math.abs(g.margin) * 0.7, 16))),
          pointBorderColor: '#141a12',
          pointBorderWidth: 1,
          order: 1,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { title: { display: true, text: 'Week', color: '#f4f0e1' }, grid: { color: 'rgba(138,154,139,0.15)' }, ticks: { color: '#f4f0e1' } },
        y: { title: { display: true, text: 'Adj. Off PPA', color: '#f4f0e1' }, grid: { color: 'rgba(138,154,139,0.15)' }, ticks: { color: '#f4f0e1' } },
      },
      plugins: {
        legend: { labels: { color: '#f4f0e1' } },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const raw = ctx.raw;
              if (raw.opponent) return `vs ${raw.opponent}: ${raw.margin > 0 ? '+' : ''}${raw.margin}`;
              return `Wk ${raw.x}: ${raw.y.toFixed(3)}`;
            },
          },
        },
      },
    },
  });

  // --- Chart 2: Success rate vs. explosiveness, all teams, selected team highlighted ---
  const others = globalLeagueProfile.filter(p => p.team !== teamName);
  const mine = globalLeagueProfile.find(p => p.team === teamName);
  const meanSucc = globalLeagueProfile.reduce((s, p) => s + p.succ, 0) / globalLeagueProfile.length;
  const meanExpl = globalLeagueProfile.reduce((s, p) => s + p.expl, 0) / globalLeagueProfile.length;

  const ctx2 = document.getElementById('teamProfileChart').getContext('2d');
  if (teamProfileChartInstance) teamProfileChartInstance.destroy();
  teamProfileChartInstance = new Chart(ctx2, {
    type: 'scatter',
    data: {
      datasets: [
        {
          label: 'All Teams',
          data: others.map(p => ({ x: p.succ, y: p.expl, team: p.team })),
          backgroundColor: 'rgba(138,154,139,0.4)',
          pointRadius: 4,
        },
        {
          label: teamName,
          data: mine ? [{ x: mine.succ, y: mine.expl, team: teamName }] : [],
          backgroundColor: '#e0a13d',
          pointRadius: 9,
          pointBorderColor: '#141a12',
          pointBorderWidth: 1.5,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { title: { display: true, text: 'Success Rate', color: '#f4f0e1' }, grid: { color: 'rgba(138,154,139,0.15)' }, ticks: { color: '#f4f0e1' } },
        y: { title: { display: true, text: 'Explosiveness', color: '#f4f0e1' }, grid: { color: 'rgba(138,154,139,0.15)' }, ticks: { color: '#f4f0e1' } },
      },
      plugins: {
        legend: { labels: { color: '#f4f0e1' } },
        tooltip: { callbacks: { label: (ctx) => `${ctx.raw.team}: succ ${ctx.raw.x.toFixed(3)}, expl ${ctx.raw.y.toFixed(3)}` } },
      },
    },
  });
}

function closeTeamModal() {
  document.getElementById('teamModal').classList.remove('active');
}

// In init(), after loading rankings: globalLeagueProfile = rankings.league_profile || [];

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}

function renderRankings(data){
  if (data && data.teams) {
    globalRankingsData = data.teams;
  }

  const body = document.getElementById('rankingsBody');
  body.innerHTML = '';

  globalRankingsData.forEach(t => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rank">${t.rank}</td>
      <td class="team">${t.team}</td>
      <td class="num rating">${t.power_rating > 0 ? '+' : ''}${t.power_rating.toFixed(1)}</td>
      <td class="num">${t.adj_off_ppa.toFixed(3)}</td>
      <td class="num">${t.adj_def_ppa.toFixed(3)}</td>
      <td class="num">${Math.round(t.elo)}</td>
      <td class="num">${t.talent.toFixed(0)}</td>
      <td class="num">${t.rp_ratio.toFixed(0)}</td>
    `;
    body.appendChild(tr);
  });
}

function sortTable(key) {
  if (currentSortKey === key) {
    sortAscending = !sortAscending;
  } else {
    currentSortKey = key;
    sortAscending = true;
  }

  globalRankingsData.sort((a, b) => {
    let valA = a[key];
    let valB = b[key];

    if (typeof valA === 'string') {
      return sortAscending 
        ? valA.localeCompare(valB) 
        : valB.localeCompare(valA);
    }

    return sortAscending ? valA - valB : valB - valA;
  });

  renderRankings();
}

/* --- KENPOM SCATTER CHART WITH TRAJECTORY LINES --- */
function initKenpomChart(teams) {
  const ctx = document.getElementById('kenpomChart').getContext('2d');
  
  const scatterPoints = teams.map(t => ({
    x: t.adj_off_ppa,
    y: t.adj_def_ppa,
    team: t.team,
    rank: t.rank,
    trajectory: t.trajectory || []
  }));

  kenpomChartInstance = new Chart(ctx, {
    type: 'scatter',
    data: {
      datasets: [
        {
          label: 'Teams',
          data: scatterPoints,
          backgroundColor: '#e0a13d',
          borderColor: '#a97a2c',
          pointRadius: 6,
          pointHoverRadius: 9
        },
        {
          label: 'Trajectory',
          data: [],
          type: 'line',
          borderColor: '#b5573f',
          borderWidth: 2,
          pointRadius: 4,
          pointBackgroundColor: '#b5573f',
          fill: false,
          showLine: true
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          title: { display: true, text: 'Adjusted Offense PPA (Higher = Better)', color: '#f4f0e1' },
          grid: { color: 'rgba(138,154,139,0.15)' },
          ticks: { color: '#f4f0e1' }
        },
        y: {
          reverse: true, // Defense: lower PPA is better
          title: { display: true, text: 'Adjusted Defense PPA (Lower = Better)', color: '#f4f0e1' },
          grid: { color: 'rgba(138,154,139,0.15)' },
          ticks: { color: '#f4f0e1' }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const raw = ctx.raw;
              if (raw.team) {
                return `#${raw.rank} ${raw.team} (Off: ${raw.x.toFixed(3)}, Def: ${raw.y.toFixed(3)})`;
              }
              return `Wk ${raw.week}: Off ${raw.x.toFixed(3)}, Def ${raw.y.toFixed(3)}`;
            }
          }
        }
      },
      onClick: (e, elements) => {
        if (elements.length > 0) {
          const index = elements[0].index;
          const selectedTeam = kenpomChartInstance.data.datasets[0].data[index];
          
          if (selectedTeam && selectedTeam.trajectory) {
            const trajPoints = selectedTeam.trajectory.map(p => ({
              x: p.adj_off_ppa,
              y: p.adj_def_ppa,
              week: p.week
            }));
            kenpomChartInstance.data.datasets[1].data = trajPoints;
            kenpomChartInstance.update();
          }
        }
      }
    }
  });
}

function pct(val, min, max) { 
  return ((val - min) / (max - min)) * 100; 
}

function gauge({value, min, max, favorTag, unit}) {
  const zeroPct = unit === "spread" ? pct(0, min, max) : null;
  const valPct = pct(value, min, max);
  const isSpread = unit === "spread";
  const fillLeft = isSpread ? Math.min(zeroPct, valPct) : 0;
  const fillWidth = isSpread ? Math.abs(valPct - zeroPct) : valPct;

  const ticks = isSpread
    ? [{p:0,l:min}, {p:50,l:"EVEN"}, {p:100,l:"+"+max}]
    : [{p:0,l:min}, {p:50,l:(min+max)/2}, {p:100,l:max}];

  const tickHtml = ticks.map(t => `
    <div class="gauge-tick ${t.l === 'EVEN' ? 'zero' : ''}" style="left:${t.p}%"></div>
    <div class="gauge-ticklabel" style="left:${t.p}%">${t.l}</div>
  `).join("");

  const flagLabel = isSpread
    ? `${favorTag} ${Math.abs(value).toFixed(1)}`
    : `${value.toFixed(1)}`;

  return `
    <div class="gauge">
      <div class="gauge-track"></div>
      <div class="gauge-fill" style="left:${fillLeft}%; width:${fillWidth}%;"></div>
      ${tickHtml}
      <div class="gauge-pin" style="left:${valPct}%">
        <div class="flag">${flagLabel}</div>
        <div class="stem"></div>
      </div>
    </div>
  `;
}

function renderMatchups(data){
  const grid = document.getElementById('matchupGrid');
  grid.innerHTML = '';
  if(!data.games.length){
    grid.innerHTML = '<div class="empty">No games found in export.</div>';
    return;
  }
  
  data.games.forEach(g => {
    const card = document.createElement('div');
    card.className = 'card';
    
    const awayTag = g.away_team ? g.away_team.substring(0, 3).toUpperCase() : 'AWY';
    const homeTag = g.home_team ? g.home_team.substring(0, 3).toUpperCase() : 'HOM';
    const isCompleted = g.status === "completed";

    if (isCompleted) {
      // Completed Game Card Design
      card.innerHTML = `
        <div class="card-head">
          <div class="matchup">
            <div class="badge away">${awayTag}</div>
            <div class="matchup-names">${g.away_team}<span class="at">@</span>${g.home_team}</div>
          </div>
          <div class="week-tag">WK ${g.week ?? '—'} · FINAL</div>
        </div>
        <div class="card-body">
          <div class="score-row">
            <div class="score-line">
              <span>${g.away_team} ${g.away_points} - ${g.home_points} ${g.home_team}</span>
            </div>
          </div>
          <div class="verdict"><b>Final Score:</b> Margin ${g.actual_margin > 0 ? '+' : ''}${g.actual_margin} (${g.home_team})</div>
          <button class="btn-pbp" onclick="loadPbpModal('${g.game_id}', '${g.home_team}', '${g.away_team}')">View Play-by-Play PPA Tug-of-War</button>
        </div>
      `;
    } else {
      // Upcoming Game Card Design
      const modelSpread = -g.predicted_margin;
      const winProbNum = parseFloat(g.home_win_prob) || 50;
      const spreadFavor = modelSpread < 0 ? homeTag : awayTag;
      
      const mktSpreadText = g.market_spread !== null && g.market_spread !== undefined ? g.market_spread : '<span class="na">N/A</span>';
      const mktTotalText = g.market_total !== null && g.market_total !== undefined ? g.market_total : '<span class="na">N/A</span>';

      card.innerHTML = `
        <div class="card-head">
          <div class="matchup">
            <div class="badge away">${awayTag}</div>
            <div class="matchup-names">${g.away_team}<span class="at">@</span>${g.home_team}</div>
          </div>
          <div class="week-tag">WK ${g.week ?? '—'} · ${fmtDate(g.start_date)}</div>
        </div>
        <div class="card-body">
          <div class="score-row">
            <div class="score-line">
              <span>${g.predicted_score}</span>
            </div>
            <div class="prob-ring" style="--pct:${winProbNum}"><span>${winProbNum.toFixed(0)}%</span></div>
          </div>
          <div class="prob-caption"><b>${g.home_team.toUpperCase()}</b> WIN PROBABILITY ${winProbNum.toFixed(1)}%</div>

          <div class="stat">
            <div class="stat-top">
              <span class="stat-label">Spread</span>
              <span class="stat-value">MKT ${mktSpreadText} &nbsp;/&nbsp; MODEL <b>${modelSpread.toFixed(1)}</b></span>
            </div>
            ${gauge({value: modelSpread, min: -35, max: 35, favorTag: spreadFavor, unit: "spread"})}
          </div>

          <div class="stat">
            <div class="stat-top">
              <span class="stat-label">Total</span>
              <span class="stat-value">MKT ${mktTotalText} &nbsp;/&nbsp; MODEL <b>${g.predicted_total.toFixed(1)}</b></span>
            </div>
            ${gauge({value: g.predicted_total, min: 30, max: 70, unit: "total"})}
          </div>

          <div class="verdict"><b>${g.blurb || `Model favors ${spreadFavor} by ${Math.abs(modelSpread).toFixed(1)}`}</b></div>
        </div>
      `;
    }
    grid.appendChild(card);
  });

  document.getElementById('metaRow').innerHTML =
    `<span>Season <b>${data.year}</b></span><span>Week <b>${data.week ?? '—'}</b></span><span>Updated <b>${new Date(data.generated_at).toLocaleString()}</b></span>`;
}

// Custom plugin: draws quarter dividers and top-3 big-play callouts directly on canvas
const tugOfWarAnnotations = {
  id: 'tugOfWarAnnotations',
  afterDatasetsDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    const { quarterBreaks, bigPlays } = chart.config.options.plugins.tugOfWarAnnotations || {};
    if (!quarterBreaks && !bigPlays) return;

    ctx.save();

    // Quarter divider lines
    if (quarterBreaks) {
      quarterBreaks.forEach(({ index, label }) => {
        const x = scales.x.getPixelForValue(index);
        ctx.strokeStyle = 'rgba(138,154,139,0.4)';
        ctx.setLineDash([3, 3]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, chartArea.top);
        ctx.lineTo(x, chartArea.bottom);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#8a9a8b';
        ctx.font = 'bold 10px JetBrains Mono, monospace';
        ctx.fillText(label, x + 4, chartArea.top + 12);
      });
    }
    ctx.restore();
  }
};
Chart.register(tugOfWarAnnotations);
  
const PBP_BASE_URL = 'https://raw.githubusercontent.com/20johnsonc/Field-Position-Site/main/pbp';
  
async function loadPbpModal(gameId, homeTeam, awayTeam) {
  document.getElementById('pbpModalTitle').innerText = `${awayTeam} @ ${homeTeam} — Cumulative PPA Tug-of-War`;
  document.getElementById('pbpModal').classList.add('active');

  try {
    const pbpData = await loadJSON(`${PBP_BASE_URL}/${gameId}.json`);

    const labels = pbpData.map((_, idx) => idx + 1);
    const cumPpa = pbpData.map(p => p.cum_net_ppa);
    const scoreDiff = pbpData.map(p => p.score_diff);

    // Quarter break indices — first play of each new period
    const quarterBreaks = [];
    let lastPeriod = null;
    pbpData.forEach((p, idx) => {
      if (p.period !== lastPeriod && idx > 0) {
        quarterBreaks.push({ index: idx, label: `Q${p.period}` });
      }
      lastPeriod = p.period;
    });

    // Top 3 plays by absolute PPA
    const bigPlays = pbpData
      .map((p, idx) => ({ index: idx, value: p.cum_net_ppa, ppa: p.net_ppa, text: p.playText || `${p.net_ppa >= 0 ? '+' : ''}${p.net_ppa.toFixed(2)} PPA` }))
      .sort((a, b) => Math.abs(b.ppa) - Math.abs(a.ppa))
      .slice(0, 3);

    const ctx = document.getElementById('pbpChart').getContext('2d');
    if (pbpChartInstance) pbpChartInstance.destroy();

    pbpChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: `Cumulative PPA (+ ${homeTeam} / − ${awayTeam})`,
            data: cumPpa,
            borderColor: '#e0a13d',
            backgroundColor: 'rgba(224,161,61,0.12)',
            fill: true,
            tension: 0.15,
            pointRadius: 0,
            yAxisID: 'y',
          },
          {
            label: 'Score Differential',
            data: scoreDiff,
            borderColor: '#d62728',
            borderDash: [4, 2],
            borderWidth: 2,
            fill: false,
            pointRadius: 0,
            yAxisID: 'y1',
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { grid: { color: 'rgba(138,154,139,0.1)' }, ticks: { color: '#8a9a8b', maxTicksLimit: 12 } },
          y: {
            position: 'left',
            grid: { color: 'rgba(138,154,139,0.15)' },
            ticks: { color: '#e0a13d' },
            title: { display: true, text: `← ${awayTeam}  |  Net PPA  |  ${homeTeam} →`, color: '#f4f0e1' },
          },
          y1: {
            position: 'right',
            grid: { drawOnChartArea: false },
            ticks: { color: '#d62728' },
            title: { display: true, text: `← ${awayTeam} lead  |  Score  |  ${homeTeam} lead →`, color: '#d62728' },
          },
        },
        plugins: {
          legend: { labels: { color: '#f4f0e1' } },
          tugOfWarAnnotations: { quarterBreaks, bigPlays },
          tooltip: {
            callbacks: {
              afterBody: (items) => {
                const idx = items[0].dataIndex;
                const play = pbpData[idx];
                return `${play.playText || ''}`;
              },
            },
          },
        },
      },
    });
  } catch (e) {
    alert('Play-by-play data not found for this game.');
    closeModal();
  }
}

function closeModal() {
  document.getElementById('pbpModal').classList.remove('active');
}

async function init(){
  try {
    const [rankings, matchups] = await Promise.all([
      loadJSON('rankings.json'),
      loadJSON('matchups.json')
    ]);
    renderRankings(rankings);
    renderMatchups(matchups);
    initKenpomChart(rankings.teams);
  } catch(e) {
    document.getElementById('rankingsBody').innerHTML = `<tr><td colspan="8" class="empty">Could not load data: ${e.message}</td></tr>`;
    document.getElementById('matchupGrid').innerHTML = `<div class="empty">Could not load data: ${e.message}</div>`;
  }
}

const scatterSection = document.getElementById('scatterSection');

function hideAllSections() {
  rankingsSection.classList.remove('active');
  scatterSection.classList.remove('active');
  matchupsSection.classList.remove('active');
  
  navRankings.classList.remove('active');
  navScatter.classList.remove('active');
  navMatchups.classList.remove('active');
}

navRankings.addEventListener('click', () => {
  hideAllSections();
  navRankings.classList.add('active');
  rankingsSection.classList.add('active');
});

navScatter.addEventListener('click', () => {
  hideAllSections();
  navScatter.classList.add('active');
  scatterSection.classList.add('active');
});

navMatchups.addEventListener('click', () => {
  hideAllSections();
  navMatchups.classList.add('active');
  matchupsSection.classList.add('active');
});

init();
