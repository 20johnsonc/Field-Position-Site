<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field Position — Analytics Dashboard</title>

  <!-- Google Fonts & Chart.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 46, 0.8);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-cyan: #06b6d4;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --badge-bg: rgba(255, 255, 255, 0.05);
      --input-bg: rgba(15, 23, 42, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .logo-area h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-area p {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .year-badge {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-cyan));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* Controls & Filter Inputs */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .controls select, .controls input {
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
      min-width: 160px;
    }

    .controls select:focus, .controls input:focus {
      border-color: var(--accent);
    }

    /* Tab Content Panels */
    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* Rankings Table */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow-x: auto;
    }

    .rank-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .rank-table th, .rank-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .rank-table th {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      user-select: none;
    }

    .rank-table th:hover {
      color: var(--text);
    }

    .rank-table tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .rank-table .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .rank-table .rating {
      font-weight: 700;
      color: #60a5fa;
    }

    /* Matchup Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .matchup {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .matchup-names {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .matchup-names .at {
      color: var(--text-muted);
      font-weight: 400;
      margin: 0 4px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--badge-bg);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .week-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 8px;
    }

    .score-line {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .prob-ring {
      font-weight: 700;
      color: var(--accent-cyan);
      font-size: 0.9rem;
    }

    .prob-caption {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: -10px;
      letter-spacing: 0.05em;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .stat-label {
      color: var(--text-muted);
    }

    .stat-value {
      font-weight: 600;
    }

    .na {
      color: var(--text-muted);
      font-style: italic;
    }

    .pbp-btn {
      width: 100%;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent);
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pbp-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    .empty {
      padding: 32px;
      text-align: center;
      color: var(--text-muted);
      width: 100%;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 900px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .chart-container {
      flex: 1;
      position: relative;
      min-height: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-area">
        <h1>Field Position</h1>
        <p>College Football Analytics & Momentum Tracking</p>
      </div>
      <div id="seasonYear" class="year-badge">2026 Season</div>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('matchups')">Matchup Slate</button>
      <button class="tab-btn" onclick="switchTab('rankings')">Power Rankings</button>
    </div>

    <!-- TAB 1: MATCHUPS -->
    <div id="matchupsPanel" class="tab-panel active">
      <div class="controls">
        <select id="matchupYearFilter" onchange="applyMatchupFilters()">
          <option value="ALL">All Years</option>
        </select>
        <select id="confFilter" onchange="applyMatchupFilters()">
          <option value="ALL">All Conferences</option>
        </select>
        <select id="weekFilter" onchange="applyMatchupFilters()">
          <option value="ALL">All Weeks</option>
        </select>
      </div>
      <div id="matchupGrid" class="grid">
        <div class="empty">Loading matchups data…</div>
      </div>
    </div>

    <!-- TAB 2: RANKINGS -->
    <div id="rankingsPanel" class="tab-panel">
      <div class="controls">
        <select id="rankingsYearFilter" onchange="applyRankingsFilters()">
          <option value="ALL">All Years</option>
        </select>
        <select id="rankingsConfFilter" onchange="onRankingsConfChange()">
          <option value="ALL">All Conferences</option>
        </select>
        <select id="rankingsTeamFilter" onchange="applyRankingsFilters()">
          <option value="ALL">All Teams</option>
        </select>
      </div>

      <div class="table-container">
        <table class="rank-table">
          <thead>
            <tr>
              <th onclick="sortTable('Rank')" style="cursor: pointer;"># ⇕</th>
              <th onclick="sortTable('Team')" style="cursor: pointer;">Team ⇕</th>
              <th onclick="sortTable('Net Rating')" style="text-align: right; cursor: pointer;">Rating ⇕</th>
              <th onclick="sortTable('Offense rating')" style="text-align: right; cursor: pointer;">Off ⇕</th>
              <th onclick="sortTable('Defense rating')" style="text-align: right; cursor: pointer;">Def ⇕</th>
              <th onclick="sortTable('Adjusted Tempo')" style="text-align: right; cursor: pointer;">Tempo ⇕</th>
              <th onclick="sortTable('W-L Record')" style="text-align: right; cursor: pointer;">Record ⇕</th>
            </tr>
          </thead>
          <tbody id="rankingsBody">
            <tr><td colspan="7" class="empty">Loading rankings…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Tug-of-War Modal -->
  <div id="pbpModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="pbpModalTitle">Game Flow & Momentum</h3>
        <button class="close-btn" onclick="closePbpModal()">&times;</button>
      </div>
      <div class="chart-container">
        <canvas id="pbpChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // Global State
    window.globalRankingsData = [];
    window.globalMatchupsData = [];
    let pbpChartInstance = null;
    let sortDirection = {};

    // Helper: Fetch JSON safely
    async function loadJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status} loading ${url}`);
      return await res.json();
    }

    // Helper: Date Formatter
    function fmtDate(dStr) {
      if (!dStr) return '';
      const d = new Date(dStr);
      return isNaN(d) ? dStr : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    // Gauge Component Generator
    function gauge({ value, min, max, favorTag, unit }) {
      return ''; 
    }

    // Navigation Tabs
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

      if (tab === 'matchups') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('matchupsPanel').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('rankingsPanel').classList.add('active');
      }
    }

    // Application Initialization
    async function init() {
      try {
        const rankingsData = await loadJSON('rankings.json');
        window.globalRankingsData = rankingsData.teams || [];
        
        const yr = rankingsData.year || (rankingsData.generated_at ? new Date(rankingsData.generated_at).getFullYear() : 2026);
        document.getElementById('seasonYear').innerText = `${yr} Season`;

        populateRankingsConferences();
        populateTeamDropdown();
        applyRankingsFilters();
      } catch (e) {
        console.error('Failed to load rankings:', e);
        document.getElementById('rankingsBody').innerHTML = '<tr><td colspan="7" class="empty">Error loading rankings data.</td></tr>';
      }

      try {
        const matchupsData = await loadJSON('matchups.json');
        window.globalMatchupsData = matchupsData.games || [];
        populateMatchupFilters(window.globalMatchupsData);
        populateYearFilters();
        applyMatchupFilters();
      } catch (e) {
        console.error('Failed to load matchups:', e);
        document.getElementById('matchupGrid').innerHTML = '<div class="empty">Error loading matchup data.</div>';
      }
    }

    // --- POPULATE FILTERS ---
    function populateYearFilters() {
      const matchupYears = new Set();
      if (window.globalMatchupsData) {
        window.globalMatchupsData.forEach(g => {
          const yr = g.season || g.year || (g.start_date ? new Date(g.start_date).getFullYear() : null);
          if (yr) matchupYears.add(yr);
        });
      }

      const mYearSelect = document.getElementById('matchupYearFilter');
      if (mYearSelect) {
        mYearSelect.innerHTML = '<option value="ALL">All Years</option>';
        Array.from(matchupYears).sort((a, b) => b - a).forEach(yr => {
          const opt = document.createElement('option');
          opt.value = yr;
          opt.textContent = yr;
          mYearSelect.appendChild(opt);
        });
      }

      const rankingsYears = new Set();
      if (window.globalRankingsData) {
        window.globalRankingsData.forEach(t => {
          const yr = t["Season"] || t["year"] || t.year || t.season;
          if (yr) rankingsYears.add(yr);
        });
      }

      const rYearSelect = document.getElementById('rankingsYearFilter');
      if (rYearSelect) {
        rYearSelect.innerHTML = '<option value="ALL">All Years</option>';
        Array.from(rankingsYears).sort((a, b) => b - a).forEach(yr => {
          const opt = document.createElement('option');
          opt.value = yr;
          opt.textContent = yr;
          rYearSelect.appendChild(opt);
        });
      }
    }

    function populateRankingsConferences() {
      const confSelect = document.getElementById('rankingsConfFilter');
      if (!confSelect || !window.globalRankingsData) return;

      const confs = new Set();
      window.globalRankingsData.forEach(t => {
        const conf = t["Conference"] || t.conference;
        if (conf) confs.add(conf);
      });

      confSelect.innerHTML = '<option value="ALL">All Conferences</option>';
      Array.from(confs).sort().forEach(conf => {
        const opt = document.createElement('option');
        opt.value = conf;
        opt.textContent = conf;
        confSelect.appendChild(opt);
      });
    }

    // Populates team filter and trims it based on selected conference
    function populateTeamDropdown() {
      const teamSelect = document.getElementById('rankingsTeamFilter');
      const selectedConf = document.getElementById('rankingsConfFilter')?.value || 'ALL';
      if (!teamSelect || !window.globalRankingsData) return;

      const currentTeam = teamSelect.value;
      teamSelect.innerHTML = '<option value="ALL">All Teams</option>';

      const filteredTeams = window.globalRankingsData
        .filter(t => selectedConf === 'ALL' || (t["Conference"] || t.conference) === selectedConf)
        .map(t => t["Team"] || t.team)
        .filter(Boolean)
        .sort();

      filteredTeams.forEach(team => {
        const opt = document.createElement('option');
        opt.value = team;
        opt.textContent = team;
        teamSelect.appendChild(opt);
      });

      if (filteredTeams.includes(currentTeam)) {
        teamSelect.value = currentTeam;
      }
    }

    function onRankingsConfChange() {
      populateTeamDropdown();
      applyRankingsFilters();
    }

    function populateMatchupFilters(games) {
      const confSelect = document.getElementById('confFilter');
      const weekSelect = document.getElementById('weekFilter');
      if (!confSelect || !games) return;

      const teamConfMap = {};
      if (window.globalRankingsData) {
        window.globalRankingsData.forEach(t => {
          const teamName = t["Team"] || t.team;
          const confName = t["Conference"] || t.conference;
          if (teamName && confName) teamConfMap[teamName] = confName;
        });
      }

      const conferences = new Set();
      const weeks = new Set();

      games.forEach(g => {
        const homeTeam = g.home_team || g.homeTeam;
        const awayTeam = g.away_team || g.awayTeam;
        const homeConf = g.home_conference || teamConfMap[homeTeam];
        const awayConf = g.away_conference || teamConfMap[awayTeam];

        if (homeConf) conferences.add(homeConf);
        if (awayConf) conferences.add(awayConf);
        if (g.week) weeks.add(g.week);
      });

      confSelect.innerHTML = '<option value="ALL">All Conferences</option>';
      Array.from(conferences).sort().forEach(conf => {
        const opt = document.createElement('option');
        opt.value = conf;
        opt.textContent = conf;
        confSelect.appendChild(opt);
      });

      if (weekSelect) {
        weekSelect.innerHTML = '<option value="ALL">All Weeks</option>';
        Array.from(weeks).sort((a, b) => a - b).forEach(wk => {
          const opt = document.createElement('option');
          opt.value = wk;
          opt.textContent = `Week ${wk}`;
          weekSelect.appendChild(opt);
        });
      }
    }

    // --- FILTER & RENDER RANKINGS ---
    function applyRankingsFilters() {
      const selectedYear = document.getElementById('rankingsYearFilter')?.value || 'ALL';
      const selectedConf = document.getElementById('rankingsConfFilter')?.value || 'ALL';
      const selectedTeam = document.getElementById('rankingsTeamFilter')?.value || 'ALL';

      if (!window.globalRankingsData) return;

      const filtered = window.globalRankingsData.filter(t => {
        const teamName = t["Team"] || t.team || '';
        const teamConf = t["Conference"] || t.conference || '';
        const teamYear = String(t["Season"] || t["year"] || t.year || t.season || '');

        const matchesYear = (selectedYear === 'ALL') || (teamYear === String(selectedYear));
        const matchesConf = (selectedConf === 'ALL') || (teamConf === selectedConf);
        const matchesTeam = (selectedTeam === 'ALL') || (teamName === selectedTeam);

        return matchesYear && matchesConf && matchesTeam;
      });

      renderRankingsTable(filtered);
    }

    function renderRankingsTable(data) {
      const body = document.getElementById('rankingsBody');
      if (!body) return;
      body.innerHTML = '';

      if (!data || !data.length) {
        body.innerHTML = '<tr><td colspan="7" class="empty">No rankings found matching filters.</td></tr>';
        return;
      }

      data.forEach(t => {
        const rank = t["Rank"] ?? t.rank ?? '—';
        const team = t["Team"] ?? t.team ?? 'Unknown';
        const netRating = Number(t["Net Rating"] ?? t.power_rating ?? 0);
        const offRating = Number(t["Offense rating"] ?? t.adj_off ?? 0);
        const defRating = Number(t["Defense rating"] ?? t.adj_def ?? 0);
        const tempo = Number(t["Adjusted Tempo"] ?? t.elo ?? 0);
        const record = t["W-L Record"] ?? t.talent ?? '—';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="rank">${rank}</td>
          <td class="team">${team}</td>
          <td class="num rating">${netRating > 0 ? '+' : ''}${netRating.toFixed(2)}</td>
          <td class="num">${offRating.toFixed(1)}</td>
          <td class="num">${defRating.toFixed(1)}</td>
          <td class="num">${tempo.toFixed(1)}</td>
          <td class="num">${record}</td>
        `;
        body.appendChild(tr);
      });
    }

    function sortTable(key) {
      if (!window.globalRankingsData) return;
      sortDirection[key] = !sortDirection[key];

      window.globalRankingsData.sort((a, b) => {
        let valA = a[key] ?? 0;
        let valB = b[key] ?? 0;
        if (typeof valA === 'string') {
          return sortDirection[key] ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
        return sortDirection[key] ? valA - valB : valB - valA;
      });

      applyRankingsFilters();
    }

    // --- FILTER & RENDER MATCHUPS ---
    function applyMatchupFilters() {
      const selectedYear = document.getElementById('matchupYearFilter')?.value || 'ALL';
      const selectedConf = document.getElementById('confFilter')?.value || 'ALL';
      const selectedWeek = document.getElementById('weekFilter')?.value || 'ALL';

      const teamConfMap = {};
      if (window.globalRankingsData) {
        window.globalRankingsData.forEach(t => {
          const teamName = t["Team"] || t.team;
          const confName = t["Conference"] || t.conference;
          if (teamName && confName) teamConfMap[teamName] = confName;
        });
      }

      const filtered = window.globalMatchupsData.filter(g => {
        const homeTeam = g.home_team || g.homeTeam;
        const awayTeam = g.away_team || g.awayTeam;
        const homeConf = g.home_conference || teamConfMap[homeTeam];
        const awayConf = g.away_conference || teamConfMap[awayTeam];
        const gameYear = String(g.season || g.year || (g.start_date ? new Date(g.start_date).getFullYear() : ''));

        const matchesYear = (selectedYear === 'ALL') || (gameYear === String(selectedYear));
        const matchesConf = (selectedConf === 'ALL') || (homeConf === selectedConf || awayConf === selectedConf);
        const matchesWeek = (selectedWeek === 'ALL') || (String(g.week) === String(selectedWeek));

        return matchesYear && matchesConf && matchesWeek;
      });

      renderMatchupCards(filtered);
    }

    function renderMatchupCards(games) {
      const grid = document.getElementById('matchupGrid');
      if (!grid) return;
      grid.innerHTML = '';

      if (!games || !games.length) {
        grid.innerHTML = '<div class="empty">No games found for the selected filters.</div>';
        return;
      }

      games.forEach(g => {
        const card = document.createElement('div');
        card.className = 'card';

        const homeTeam = g.home_team ?? g.homeTeam ?? 'Home';
        const awayTeam = g.away_team ?? g.awayTeam ?? 'Away';
        const awayTag = awayTeam.substring(0, 3).toUpperCase();
        const homeTag = homeTeam.substring(0, 3).toUpperCase();
        const gameId = g.game_id ?? g.gameId;

        const hasScores = g.home_points !== undefined && g.away_points !== undefined;
        const isCompleted = g.status === 'completed' || hasScores;

        let scoreDisplay = '—';
        if (hasScores) {
          scoreDisplay = `${awayTeam} ${g.away_points} - ${g.home_points} ${homeTeam}`;
        } else if (g.predicted_score) {
          scoreDisplay = g.predicted_score;
        }

        const dateTag = g.start_date ? fmtDate(g.start_date) : '';
        const winProbNum = parseFloat(g.home_win_prob ?? g.win_prob ?? 50) || 50;

        const mktSpreadText = (g.market_spread !== null && g.market_spread !== undefined) ? g.market_spread : '<span class="na">N/A</span>';
        const mktTotalText = (g.market_total !== null && g.market_total !== undefined) ? g.market_total : '<span class="na">N/A</span>';
        const predMargin = Number(g.predicted_margin ?? 0);
        const modelSpread = -predMargin;
        const predTotal = Number(g.predicted_total ?? (hasScores ? g.home_points + g.away_points : 0));

        card.innerHTML = `
          <div class="card-head">
            <div class="matchup">
              <div class="badge away">${awayTag}</div>
              <div class="matchup-names">${awayTeam} <span class="at">@</span> ${homeTeam}</div>
            </div>
            <div class="week-tag">WK ${g.week ?? '—'} ${dateTag ? '· ' + dateTag : ''}</div>
          </div>
          <div class="card-body">
            <div class="score-row">
              <div class="score-line">
                <span>${scoreDisplay}</span>
              </div>
              ${g.home_win_prob ? `<div class="prob-ring"><span>${Math.round(winProbNum)}%</span></div>` : ''}
            </div>
            ${g.home_win_prob ? `<div class="prob-caption"><b>${homeTeam.toUpperCase()}</b> WIN PROBABILITY ${winProbNum.toFixed(1)}%</div>` : ''}

            ${!hasScores && g.predicted_margin !== undefined ? `
              <div class="stat" style="margin-top: 8px;">
                <div class="stat-top">
                  <span class="stat-label">Spread</span>
                  <span class="stat-value">MKT ${mktSpreadText} &nbsp;/&nbsp; MODEL <b>${modelSpread.toFixed(1)}</b></span>
                </div>
              </div>

              <div class="stat">
                <div class="stat-top">
                  <span class="stat-label">Total</span>
                  <span class="stat-value">MKT ${mktTotalText} &nbsp;/&nbsp; MODEL <b>${predTotal.toFixed(1)}</b></span>
                </div>
              </div>
            ` : ''}

            <div class="verdict" style="margin-top: 12px; text-align: center;">
              <button class="pbp-btn" onclick="loadPbpModal('${gameId}', '${homeTeam}', '${awayTeam}')">
                📊 View Tug-of-War Chart
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Modal Logic
    async function loadPbpModal(gameId, homeTeam, awayTeam) {
      const modal = document.getElementById('pbpModal');
      const title = document.getElementById('pbpModalTitle');
      const chartContainer = document.getElementById('pbpChart').parentNode;
      
      chartContainer.innerHTML = '<canvas id="pbpChart"></canvas>';
      title.innerText = `${awayTeam} @ ${homeTeam} — Game Flow & Momentum`;
      modal.classList.add('active');

      try {
        let pbpData;
        try {
          pbpData = await loadJSON(`pbp/pbp_${gameId}.json`);
        } catch (e) {
          pbpData = await loadJSON(`pbp/${gameId}.json`);
        }

        const ctx = document.getElementById('pbpChart').getContext('2d');
        const ppaValues = pbpData.map(d => Number(d.cum_ppa ?? d.cum_net_ppa ?? d.net_ppa ?? d.ppa ?? 0));
        const scoreDiffValues = pbpData.map(d => Number(d.score_diff ?? d.margin ?? 0));
        const labels = pbpData.map((d, i) => d.play_number || d.play_num || i + 1);

        const maxPpa = Math.max(1, ...ppaValues.map(Math.abs));
        const maxDiff = Math.max(1, ...scoreDiffValues.map(Math.abs));

        if (pbpChartInstance) pbpChartInstance.destroy();

        pbpChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Net Momentum Advantage',
                data: ppaValues,
                borderColor: '#3b82f6',
                borderWidth: 2.5,
                fill: false,
                tension: 0.1,
                yAxisID: 'y'
              },
              {
                label: 'Actual Score Lead',
                data: scoreDiffValues,
                borderColor: '#ef4444',
                borderWidth: 2,
                borderDash: [6, 4],
                fill: false,
                tension: 0,
                yAxisID: 'y1'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                type: 'linear',
                position: 'left',
                min: -(maxPpa * 1.2),
                max: maxPpa * 1.2
              },
              y1: {
                type: 'linear',
                position: 'right',
                min: -(maxDiff * 1.2),
                max: maxDiff * 1.2
              }
            }
          }
        });
      } catch (err) {
        console.error(err);
        chartContainer.innerHTML = `<div class="empty">Play-by-play data not available for this game.</div>`;
      }
    }

    function closePbpModal() {
      document.getElementById('pbpModal').classList.remove('active');
    }

    // Run Initialization
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
