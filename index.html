<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Position | CFB Power Ratings & Matchup Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --field: #0f2818;
    --field-dark: #0a1c10;
    --chalk: #f4f0e1;
    --chalk-dim: #e8e2cd;
    --ink: #141a12;
    --gold: #e0a13d;
    --gold-dim: #a97a2c;
    --hash: #2c4a34;
    --muted: #8a9a8b;
    --good: #5f9e6f;
    --bad: #b5573f;
    --field-line: #1B3A28;
    --chalk-line: #E1D9BE;
    --ink-dim: #6B6656;
    --model: #B8452E;
    --market: #5E6F63;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 120px),
      linear-gradient(180deg, var(--field) 0%, var(--field-dark) 100%);
    color: var(--chalk);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  header {
    padding: 36px 24px 24px;
    max-width: 1180px;
    margin: 0 auto;
    border-bottom: 1px solid var(--field-line);
  }
  .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 2.4rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--chalk);
  }
  .brand h1 span { color: var(--gold); }
  .brand .tag { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.3px; }
  .meta-row {
    margin-top: 14px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .meta-row b { color: var(--gold); }

  nav {
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 24px 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  nav button {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 0.85rem;
    font-weight: 500;
    background: transparent;
    border: 1px solid var(--hash);
    color: var(--muted);
    padding: 9px 20px;
    cursor: pointer;
    transition: all .15s ease;
  }
  nav button.active { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  nav button:not(.active):hover { border-color: var(--gold-dim); color: var(--chalk); }

  main { max-width: 1180px; margin: 0 auto; padding: 28px 24px; }
  section { display: none; }
  section.active { display: block; }

  .rank-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    background: rgba(244,240,225,0.03);
  }
  .rank-table thead th {
    text-align: left;
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-size: 0.7rem;
    color: var(--gold);
    padding: 10px 12px;
    border-bottom: 2px solid var(--gold-dim);
  }
  .rank-table td { padding: 9px 12px; border-bottom: 1px solid rgba(138,154,139,0.15); }
  .rank-table tbody tr:hover { background: rgba(224,161,61,0.07); }
  .rank-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank-table td.rank { color: var(--gold); font-weight: 700; width: 36px; }
  .rank-table td.team { font-family: 'Oswald', sans-serif; letter-spacing: 0.2px; color: var(--chalk); font-size: 0.92rem; }
  .rank-table td.rating { font-weight: 700; color: var(--chalk); }
  .team-link {
    cursor: pointer;
    text-decoration: underline dotted;
    text-decoration-color: var(--gold-dim);
  }
  .team-link:hover { color: var(--gold); }

  .chart-container {
    background: rgba(244,240,225,0.03);
    border: 1px solid var(--field-line);
    border-radius: 6px;
    padding: 20px;
    position: relative;
    height: 600px;
    width: 100%;
  }

  .matchup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
    gap: 28px;
  }
  @media (max-width: 860px) { .matchup-grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--chalk);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 18px 40px -18px rgba(0,0,0,0.55);
  }
  .card-head {
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 46px),
      var(--field);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .matchup { display: flex; align-items: center; gap: 12px; }
  .badge {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.02em;
    flex: none;
  }
  .badge.away { background: transparent; border: 1.5px solid rgba(243,238,221,0.45); color: var(--chalk); }
  .badge.home { background: var(--gold); color: var(--field); border: 1.5px solid var(--gold); }
  .matchup-names {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    color: var(--chalk);
    font-size: 15px;
    letter-spacing: 0.03em;
    line-height: 1.2;
  }
  .matchup-names .at { color: var(--gold); font-weight: 400; margin: 0 5px; font-size: 12px; }
  .week-tag { font-family: 'JetBrains Mono', monospace; color: var(--gold); font-size: 12px; letter-spacing: 0.06em; white-space: nowrap; }

  .card-body { padding: 22px 22px 18px; }
  .score-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .score-line { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 24px; color: var(--ink); letter-spacing: 0.01em; }

  .prob-ring {
    --pct: 50;
    width: 58px; height: 58px;
    border-radius: 50%;
    flex: none;
    background: conic-gradient(var(--gold) calc(var(--pct)*1%), var(--chalk-line) 0);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .prob-ring::before { content: ''; position: absolute; width: 44px; height: 44px; border-radius: 50%; background: var(--chalk); }
  .prob-ring span { position: relative; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12.5px; color: var(--ink); }

  .prob-caption {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin: -10px 0 18px;
  }
  .prob-caption b { color: var(--model); }

  .stat { margin: 20px 0 26px; }
  .stat-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--ink-dim); text-transform: uppercase; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink); }
  .stat-value b { color: var(--model); }
  .stat-value .na { color: var(--market); }

  .gauge { position: relative; height: 34px; margin: 0 4px 4px; }
  .gauge-track { position: absolute; top: 14px; left: 0; right: 0; height: 4px; background: var(--chalk-line); border-radius: 2px; }
  .gauge-fill { position: absolute; top: 14px; height: 4px; background: var(--model); border-radius: 2px; opacity: 0.85; }
  .gauge-tick { position: absolute; top: 10px; width: 1px; height: 12px; background: var(--chalk-line); }
  .gauge-tick.zero { background: var(--ink-dim); width: 1.5px; }
  .gauge-ticklabel { position: absolute; top: 24px; transform: translateX(-50%); font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--ink-dim); }
  .gauge-pin { position: absolute; top: -2px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .gauge-pin .flag {
    background: var(--model);
    color: var(--chalk);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .gauge-pin .stem { width: 2px; height: 8px; background: var(--model); }

  .verdict {
    border-left: 3px solid var(--gold);
    padding: 10px 14px;
    margin: 4px 0 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    background: rgba(217,164,65,0.08);
  }
  .verdict b { font-weight: 600; }

  .btn-pbp {
    display: inline-block;
    width: 100%;
    text-align: center;
    background: var(--field);
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    font-family: 'Oswald', sans-serif;
    font-size: 0.85rem;
    padding: 8px 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s ease;
  }
  .btn-pbp:hover { background: var(--gold); color: var(--ink); }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 28, 16, 0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: var(--field-dark);
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    width: 100%;
    max-width: 900px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 20px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.8rem;
    cursor: pointer;
  }
  .modal-close:hover { color: var(--gold); }
  .modal-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1.5rem;
    color: var(--chalk);
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .empty {
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 40px 0;
    text-align: center;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>FIELD <span>POSITION</span></h1>
    <div class="tag">power ratings &amp; matchup model — for research &amp; entertainment purposes only</div>
  </div>
  <div class="meta-row" id="metaRow"><span>LOADING…</span></div>
</header>

<nav>
  <button id="navRankings" class="active">Power Ratings</button>
  <button id="navScatter">Scatter Chart</button>
  <button id="navMatchups">Matchup Cards</button>
</nav>

<main>
  <section id="rankingsSection" class="active">
    <div class="controls">
      <!-- Add Year Filter -->
      <select id="rankingsYearFilter" onchange="applyRankingsFilters()">
        <option value="ALL">All Years</option>
      </select>
    
      <!-- Existing Controls -->
      <input type="text" id="rankingsSearch" placeholder="Search team..." oninput="applyRankingsFilters()" />
      <select id="rankingsConfFilter" onchange="applyRankingsFilters()">
        <option value="ALL">All Conferences</option>
      </select>
    </div>
    <table class="rank-table">
      <thead>
        <tr>
          <th onclick="sortTable('Rank')" style="cursor: pointer;"># ⇕</th>
          <th onclick="sortTable('Team')" style="cursor: pointer;">Team ⇕</th>
          <th onclick="sortTable('Net Rating')" style="text-align: right; cursor: pointer;">Rating ⇕</th>
          <th onclick="sortTable('Offense rating')" style="text-align: right; cursor: pointer;">Off ⇕</th>
          <th onclick="sortTable('Defense rating')" style="text-align: right; cursor: pointer;">Def ⇕</th>
          <th onclick="sortTable('Adjusted Tempo')" style="text-align: right; cursor: pointer;">Tempo ⇕</th>
          <th onclick="sortTable('W-L Record')" style="text-align: right; cursor: pointer;">Record ⇕</th>
        </tr>
      </thead>
      <tbody id="rankingsBody">
        <tr><td colspan="8" class="empty">Loading rankings…</td></tr>
      </tbody>
    </table>
  </section>

  <section id="scatterSection">
    <div class="chart-container">
      <canvas id="kenpomChart"></canvas>
    </div>
  </section>

  <section id="matchupsSection">
    <div class="controls">
      <!-- Add Year Filter -->
      <select id="matchupYearFilter" onchange="applyMatchupFilters()">
        <option value="ALL">All Years</option>
      </select>
    
      <!-- Existing Controls -->
      <select id="confFilter" onchange="applyMatchupFilters()">
        <option value="ALL">All Conferences</option>
      </select>
      <select id="weekFilter" onchange="applyMatchupFilters()">
        <option value="ALL">All Weeks</option>
      </select>
    </div>
    <div class="matchup-grid" id="matchupGrid">
      <div class="empty">Loading matchups…</div>
    </div>
  </section>
</main>

<div class="modal-overlay" id="pbpModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-title" id="pbpModalTitle">PPA Tug-of-War</div>
    <div style="height: 400px; position: relative;">
      <canvas id="pbpChart"></canvas>
    </div>
  </div>
</div>

<div class="modal-overlay" id="teamModal">
  <div class="modal-content" style="max-width: 1100px;">
    <button class="modal-close" onclick="closeTeamModal()">&times;</button>
    <div class="modal-title" id="teamModalTitle">Team Performance</div>
    <div style="display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px;">
      <div style="height: 420px; position: relative;">
        <canvas id="teamTrajectoryChart"></canvas>
      </div>
      <div style="height: 420px; position: relative;">
        <canvas id="teamProfileChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
let currentSortKey = 'rank';
let sortAscending = true;
let globalRankingsData = [];
let globalLeagueProfile = [];
let globalMatchupsData = [];

let kenpomChartInstance = null;
let pbpChartInstance = null;
let teamTrajectoryChartInstance = null;
let teamProfileChartInstance = null;

async function loadJSON(path){
  const res = await fetch(path);
  if(!res.ok) throw new Error('failed to load ' + path);
  return res.json();
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}

function renderRankings(data) {
  if (data && data.teams) {
    globalRankingsData = data.teams;
  }

  const body = document.getElementById('rankingsBody');
  if (!body) return;
  body.innerHTML = '';

  globalRankingsData.forEach(t => {
    // Read exact keys from your JSON schema with safe fallbacks
    const rank = t["Rank"] ?? t.rank ?? '—';
    const team = t["Team"] ?? t.team ?? 'Unknown';
    const netRating = Number(t["Net Rating"] ?? t.power_rating ?? 0);
    const offRating = Number(t["Offense rating"] ?? t.adj_off ?? 0);
    const defRating = Number(t["Defense rating"] ?? t.adj_def ?? 0);
    const tempo = Number(t["Adjusted Tempo"] ?? t.elo ?? 0);
    const record = t["W-L Record"] ?? t.talent ?? '—';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rank">${rank}</td>
      <td class="team">${team}</td>
      <td class="num rating">${netRating > 0 ? '+' : ''}${netRating.toFixed(2)}</td>
      <td class="num">${offRating.toFixed(1)}</td>
      <td class="num">${defRating.toFixed(1)}</td>
      <td class="num">${tempo.toFixed(1)}</td>
      <td class="num">${record}</td>
    `;
    body.appendChild(tr);
  });
}

// --- POPULATE YEAR FILTERS ---
function populateYearFilters() {
  // Extract unique years from Matchups
  const matchupYears = new Set();
  if (window.globalMatchupsData) {
    window.globalMatchupsData.forEach(g => {
      const yr = g.season || g.year || (g.start_date ? new Date(g.start_date).getFullYear() : null);
      if (yr) matchupYears.add(yr);
    });
  }

  // Populate Matchup Year Dropdown
  const mYearSelect = document.getElementById('matchupYearFilter');
  if (mYearSelect) {
    const currentVal = mYearSelect.value;
    mYearSelect.innerHTML = '<option value="ALL">All Years</option>';
    Array.from(matchupYears).sort((a, b) => b - a).forEach(yr => {
      const opt = document.createElement('option');
      opt.value = yr;
      opt.textContent = yr;
      mYearSelect.appendChild(opt);
    });
    if (currentVal) mYearSelect.value = currentVal;
  }

  // Extract unique years from Rankings
  const rankingsYears = new Set();
  if (window.globalRankingsData) {
    window.globalRankingsData.forEach(t => {
      const yr = t["Season"] || t["year"] || t.year || t.season;
      if (yr) rankingsYears.add(yr);
    });
  }

  // Populate Rankings Year Dropdown
  const rYearSelect = document.getElementById('rankingsYearFilter');
  if (rYearSelect) {
    const currentVal = rYearSelect.value;
    rYearSelect.innerHTML = '<option value="ALL">All Years</option>';
    Array.from(rankingsYears).sort((a, b) => b - a).forEach(yr => {
      const opt = document.createElement('option');
      opt.value = yr;
      opt.textContent = yr;
      rYearSelect.appendChild(opt);
    });
    if (currentVal) rYearSelect.value = currentVal;
  }
}

// --- APPLY MATCHUP FILTERS ---
function applyMatchupFilters() {
  const selectedYear = document.getElementById('matchupYearFilter')?.value || 'ALL';
  const selectedConf = document.getElementById('confFilter')?.value || 'ALL';
  const selectedWeek = document.getElementById('weekFilter')?.value || 'ALL';

  // Build team-to-conference lookup map
  const teamConfMap = {};
  if (window.globalRankingsData && Array.isArray(window.globalRankingsData)) {
    window.globalRankingsData.forEach(t => {
      const teamName = t["Team"] || t.team;
      const confName = t["Conference"] || t.conference;
      if (teamName && confName) teamConfMap[teamName] = confName;
    });
  }

  const filtered = globalMatchupsData.filter(g => {
    const homeTeam = g.home_team || g.homeTeam;
    const awayTeam = g.away_team || g.awayTeam;

    const homeConf = g.home_conference || teamConfMap[homeTeam];
    const awayConf = g.away_conference || teamConfMap[awayTeam];

    const gameYear = String(g.season || g.year || (g.start_date ? new Date(g.start_date).getFullYear() : ''));

    const matchesYear = (selectedYear === 'ALL') || (gameYear === String(selectedYear));
    const matchesConf = (selectedConf === 'ALL') || (homeConf === selectedConf || awayConf === selectedConf);
    const matchesWeek = (selectedWeek === 'ALL') || (String(g.week) === String(selectedWeek));

    return matchesYear && matchesConf && matchesWeek;
  });

  renderMatchupCards(filtered);
}

// --- APPLY RANKINGS FILTERS ---
function applyRankingsFilters() {
  const selectedYear = document.getElementById('rankingsYearFilter')?.value || 'ALL';
  const selectedConf = document.getElementById('rankingsConfFilter')?.value || 'ALL';
  const searchQuery = document.getElementById('rankingsSearch')?.value.toLowerCase().trim() || '';

  if (!window.globalRankingsData) return;

  const filtered = window.globalRankingsData.filter(t => {
    const teamName = (t["Team"] || t.team || '').toLowerCase();
    const teamConf = t["Conference"] || t.conference || '';
    const teamYear = String(t["Season"] || t["year"] || t.year || t.season || '');

    const matchesYear = (selectedYear === 'ALL') || (teamYear === String(selectedYear));
    const matchesConf = (selectedConf === 'ALL') || (teamConf === selectedConf);
    const matchesSearch = !searchQuery || teamName.includes(searchQuery);

    return matchesYear && matchesConf && matchesSearch;
  });

  renderRankingsTable(filtered);
}

// --- RENDER RANKINGS TABLE ---
function renderRankingsTable(data) {
  const body = document.getElementById('rankingsBody');
  if (!body) return;
  body.innerHTML = '';

  if (!data || !data.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty">No rankings found matching filters.</td></tr>';
    return;
  }

  data.forEach(t => {
    const rank = t["Rank"] ?? t.rank ?? '—';
    const team = t["Team"] ?? t.team ?? 'Unknown';
    const netRating = Number(t["Net Rating"] ?? t.power_rating ?? 0);
    const offRating = Number(t["Offense rating"] ?? t.adj_off ?? 0);
    const defRating = Number(t["Defense rating"] ?? t.adj_def ?? 0);
    const tempo = Number(t["Adjusted Tempo"] ?? t.elo ?? 0);
    const record = t["W-L Record"] ?? t.talent ?? '—';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rank">${rank}</td>
      <td class="team">${team}</td>
      <td class="num rating">${netRating > 0 ? '+' : ''}${netRating.toFixed(2)}</td>
      <td class="num">${offRating.toFixed(1)}</td>
      <td class="num">${defRating.toFixed(1)}</td>
      <td class="num">${tempo.toFixed(1)}</td>
      <td class="num">${record}</td>
    `;
    body.appendChild(tr);
  });
}
  
function sortTable(key) {
  if (currentSortKey === key) {
    sortAscending = !sortAscending;
  } else {
    currentSortKey = key;
    sortAscending = true;
  }

  globalRankingsData.sort((a, b) => {
    let valA = a[key];
    let valB = b[key];

    if (typeof valA === 'string') {
      return sortAscending
        ? valA.localeCompare(valB)
        : valB.localeCompare(valA);
    }
    return sortAscending ? valA - valB : valB - valA;
  });

  renderRankings();
}

/* --- KENPOM SCATTER CHART WITH TRAJECTORY LINES --- */
function initKenpomChart(teams) {
  const ctx = document.getElementById('kenpomChart').getContext('2d');

  const scatterPoints = teams.map(t => ({
    x: t.adj_off_ppa,
    y: t.adj_def_ppa,
    team: t.team,
    rank: t.rank,
    trajectory: t.trajectory || []
  }));

  kenpomChartInstance = new Chart(ctx, {
    type: 'scatter',
    data: {
      datasets: [
        {
          label: 'Teams',
          data: scatterPoints,

function pct(val, min, max) {
  return ((val - min) / (max - min)) * 100;
}

function gauge({value, min, max, favorTag, unit}) {
  const zeroPct = unit === "spread" ? pct(0, min, max) : null;
  const valPct = pct(value, min, max);
  const isSpread = unit === "spread";
  const fillLeft = isSpread ? Math.min(zeroPct, valPct) : 0;
  const fillWidth = isSpread ? Math.abs(valPct - zeroPct) : valPct;

  const ticks = isSpread
    ? [{p:0,l:min}, {p:50,l:"EVEN"}, {p:100,l:"+"+max}]
    : [{p:0,l:min}, {p:50,l:(min+max)/2}, {p:100,l:max}];

  const tickHtml = ticks.map(t => `
    <div class="gauge-tick ${t.l === 'EVEN' ? 'zero' : ''}" style="left:${t.p}%"></div>
    <div class="gauge-ticklabel" style="left:${t.p}%">${t.l}</div>
  `).join("");

  const flagLabel = isSpread
    ? `${favorTag} ${Math.abs(value).toFixed(1)}`
    : `${value.toFixed(1)}`;

  return `
    <div class="gauge">
      <div class="gauge-track"></div>
      <div class="gauge-fill" style="left:${fillLeft}%; width:${fillWidth}%;"></div>
      ${tickHtml}
      <div class="gauge-pin" style="left:${valPct}%">
        <div class="flag">${flagLabel}</div>
        <div class="stem"></div>
      </div>
    </div>
  `;
}

function populateMatchupFilters(games) {
  const confSelect = document.getElementById('confFilter');
  if (!confSelect) return;

  // Build a lookup map of Team Name -> Conference from loaded Rankings data
  const teamConfMap = {};
  if (window.globalRankingsData && Array.isArray(window.globalRankingsData)) {
    window.globalRankingsData.forEach(t => {
      const teamName = t["Team"] || t.team;
      const confName = t["Conference"] || t.conference;
      if (teamName && confName) {
        teamConfMap[teamName] = confName;
      }
    });
  }

  const conferences = new Set();

  games.forEach(g => {
    const homeTeam = g.home_team || g.homeTeam;
    const awayTeam = g.away_team || g.awayTeam;

    // Check direct game conference properties first, then check team lookup map
    const homeConf = g.home_conference || teamConfMap[homeTeam];
    const awayConf = g.away_conference || teamConfMap[awayTeam];

    if (homeConf) conferences.add(homeConf);
    if (awayConf) conferences.add(awayConf);
  });

  // Keep existing "All Conferences" option and append sorted options
  confSelect.innerHTML = '<option value="ALL">All Conferences</option>';
  
  Array.from(conferences).sort().forEach(conf => {
    const opt = document.createElement('option');
    opt.value = conf;
    opt.textContent = conf;
    confSelect.appendChild(opt);
  });
}

          </div>

const tugOfWarAnnotations = {
  id: 'tugOfWarAnnotations',
  afterDatasetsDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    const { quarterBreaks } = chart.config.options.plugins.tugOfWarAnnotations || {};
    if (!quarterBreaks) return;

    ctx.save();
    quarterBreaks.forEach(({ index, label }) => {
      const x = scales.x.getPixelForValue(index);
      ctx.strokeStyle = 'rgba(138,154,139,0.4)';
      ctx.setLineDash([3, 3]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, chartArea.top);
      ctx.lineTo(x, chartArea.bottom);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#8a9a8b';
      ctx.font = 'bold 10px JetBrains Mono, monospace';
      ctx.fillText(label, x + 4, chartArea.top + 12);
    });
    ctx.restore();
  }
};
Chart.register(tugOfWarAnnotations);

async function loadPbpModal(gameId, homeTeam, awayTeam) {
  const modal = document.getElementById('pbpModal');
  const title = document.getElementById('pbpModalTitle');
  const chartContainer = document.getElementById('pbpChart').parentNode;
  
  // Re-create canvas element dynamically so previous errors don't break future loads
  chartContainer.innerHTML = '<canvas id="pbpChart"></canvas>';
  
  title.innerText = `${awayTeam} @ ${homeTeam} — Game Flow & Momentum`;
  modal.classList.add('active');

  try {
    // Look inside the 'pbp' folder (handles both pbp/pbp_12345.json or pbp/12345.json)
    let pbpData;
    try {
      pbpData = await loadJSON(`pbp/pbp_${gameId}.json`);
    } catch (e) {
      pbpData = await loadJSON(`pbp/${gameId}.json`);
    }

    const ctx = document.getElementById('pbpChart').getContext('2d');

    // Robust mapping for varying JSON key names
    const ppaValues = pbpData.map(d => Number(d.cum_ppa ?? d.cum_net_ppa ?? d.net_ppa ?? d.ppa ?? 0));
    const scoreDiffValues = pbpData.map(d => Number(d.score_diff ?? d.margin ?? 0));
    const labels = pbpData.map((d, i) => d.play_number || d.play_num || i + 1);

    // Compute symmetrical max bounds to align 0 on both axes precisely in the vertical center
    const maxPpa = Math.max(1, ...ppaValues.map(Math.abs));
    const maxDiff = Math.max(1, ...scoreDiffValues.map(Math.abs));

    if (pbpChartInstance) {
      pbpChartInstance.destroy();
    }

    pbpChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: `${homeTeam} Efficiency (+ PPA)`,
            data: ppaValues.map(v => v >= 0 ? v : 0),
            backgroundColor: 'rgba(31, 119, 180, 0.35)', // Home Blue
            borderColor: 'transparent',
            fill: 'origin',
            pointRadius: 0,
            yAxisID: 'y'
          },
          {
            label: `${awayTeam} Efficiency (- PPA)`,
            data: ppaValues.map(v => v < 0 ? v : 0),
            backgroundColor: 'rgba(255, 127, 14, 0.35)', // Away Orange
            borderColor: 'transparent',
            fill: 'origin',
            pointRadius: 0,
            yAxisID: 'y'
          },
          {
            label: 'Net Momentum Advantage',
            data: ppaValues,
            borderColor: '#333333',
            borderWidth: 2.5,
            fill: false,
            pointRadius: 0,
            pointHoverRadius: 5,
            tension: 0.1,
            yAxisID: 'y'
          },
          {
            label: 'Actual Score Lead',
            data: scoreDiffValues,
            borderColor: '#d62728', // Score diff Red line
            borderWidth: 2,
            borderDash: [6, 4],
            fill: false,
            pointRadius: 0,
            pointHoverRadius: 5,
            tension: 0,
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            position: 'top',
            align: 'center',
            labels: {
              color: '#333333',
              font: { family: 'Inter, sans-serif', size: 12, weight: '500' },
              padding: 14,
              usePointStyle: true,
              filter: (item) => !item.text.includes('Efficiency')
            }
          },
          tooltip: {
            backgroundColor: 'rgba(255, 255, 255, 0.95)',
            titleColor: '#111111',
            bodyColor: '#333333',
            borderColor: '#cccccc',
            borderWidth: 1,
            padding: 10,
            callbacks: {
              title: (items) => `Play #${items[0].label}`,
              label: (context) => {
                const val = context.raw;
                if (context.dataset.label === 'Net Momentum Advantage') {
                  const leader = val >= 0 ? homeTeam : awayTeam;
                  return `Momentum: ${leader} +${Math.abs(val).toFixed(2)} PPA`;
                }
                if (context.dataset.label === 'Actual Score Lead') {
                  if (val === 0) return `Score: Tied`;
                  const leader = val > 0 ? homeTeam : awayTeam;
                  return `Score: ${leader} +${Math.abs(val)} pts`;
                }
                return null;
              }
            }
          }
        },
        scales: {
          x: {
            title: { display: true, text: 'Play Number (Chronological)', color: '#333333', font: { weight: 'bold' } },
            grid: { color: '#e5e5e5' },
            ticks: { color: '#333333' }
          },
          y: {
            type: 'linear',
            position: 'left',
            min: -(maxPpa * 1.2),
            max: maxPpa * 1.2,
            title: { 
              display: true, 
              text: `← ${awayTeam} Advantage  |  Offensive Momentum (PPA)  |  ${homeTeam} Advantage →`, 
              color: '#333333', 
              font: { weight: 'bold', size: 12 } 
            },
            grid: { color: '#e5e5e5' },
            ticks: { color: '#333333' }
          },
          y1: {
            type: 'linear',
            position: 'right',
            min: -(maxDiff * 1.2),
            max: maxDiff * 1.2,
            title: { 
              display: true, 
              text: `← ${awayTeam} Lead  |  Score Differential (Points)  |  ${homeTeam} Lead →`, 
              color: '#d62728', 
              font: { weight: 'bold', size: 12 } 
            },
            grid: { drawOnChartArea: false },
            ticks: { color: '#d62728' }
          }
        }
      }
    });
  } catch (err) {
    console.error(err);
    chartContainer.innerHTML = 
      `<div class="empty">Play-by-play data not available for this game.</div>`;
  }
}

navMatchups.addEventListener('click', () => {
  hideAllSections();
  navMatchups.classList.add('active');
  matchupsSection.classList.add('active');
});

init();
</script>
</body>
</html>
